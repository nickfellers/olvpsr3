title: "Stations of the Cross"
section: "Prayers and Practices of Our Faith"
book_pages: "258–259"

sources:
  book_scan: "rawdata/stationsandlesson13.pdf"

description: "The 14 Stations of the Cross represent events from Jesus' Passion and Death. At each station, we use our senses and our imagination to reflect prayerfully on Jesus' suffering, Death, and Resurrection."

stations:
  - number: 1
    title: "Jesus Is Condemned to Death"
    description: "Pontius Pilate condemns Jesus to death."

  - number: 2
    title: "Jesus Takes Up the Cross"
    description: "Jesus willingly accepts and patiently bears the cross."

  - number: 3
    title: "Jesus Falls the First Time"
    description: "Weakened by torments and loss of blood, Jesus falls beneath the cross."

  - number: 4
    title: "Jesus Meets His Sorrowful Mother"
    description: "Jesus meets his mother, Mary, who is filled with grief."

  - number: 5
    title: "Simon of Cyrene Helps Jesus Carry the Cross"
    description: "Soldiers force Simon of Cyrene to carry the cross."

  - number: 6
    title: "Veronica Wipes the Face of Jesus"
    description: "Veronica steps through the crowd to wipe the face of Jesus."

  - number: 7
    title: "Jesus Falls the Second Time"
    description: "Jesus falls beneath the weight of the cross a second time."

  - number: 8
    title: "Jesus Meets the Women of Jerusalem"
    description: "Jesus tells the women not to weep for him but for themselves and for their children."

  - number: 9
    title: "Jesus Falls the Third Time"
    description: "Weakened almost to the point of death, Jesus falls a third time."

  - number: 10
    title: "Jesus Is Stripped of His Garments"
    description: "The soldiers strip Jesus of his garments, treating him as a common criminal."

  - number: 11
    title: "Jesus Is Nailed to the Cross"
    description: "Jesus' hands and feet are nailed to the cross."

  - number: 12
    title: "Jesus Dies on the Cross"
    description: "After suffering greatly on the cross, Jesus bows his head and dies."

  - number: 13
    title: "Jesus Is Taken Down from the Cross"
    description: "The lifeless body of Jesus is tenderly placed in the arms of Mary, his mother."

  - number: 14
    title: "Jesus Is Laid in the Tomb"
    description: "Jesus' disciples place his body in the tomb."

closing_note: "A closing prayer, sometimes in the form of a 15th station, invites us to reflect on the Resurrection of Jesus."
