session: 20
title: "Celebrating Lent and Holy Week"
unit: 4
unit_title: "Sacraments, Our Way of Life"
book_pages: "163–168"
theme: "Lent and Holy Week are times to think of how we treat others."
duration: "1 hour"

sources:
  book_scan: "rawdata/lesson20bookscan.pdf"
  lesson_planner: "rawdata/Unit 4 (Sessions 16-20)/Finding_God_2021_G3_PARISH_Interactive_Lesson_Planner_Unit_4/Finding_God_2021_G3_PARISH_Interactive_Lesson_Planner_Session_20.docx"
  jeopardy: "https://jeopardylabs.com/play/lent-1037"

outcomes:
  - "Retell the story of Jesus and the Samaritan woman at the well."
  - "Explain that Lent is a time to think about how we treat others."
  - "Describe practices and experiences of Lent and Holy Week."
  - "Define almsgiving, intercessions, and Prayer of the Faithful."

vocabulary:
  almsgiving: "Sharing money, time, and resources to help others; a Lenten practice."
  intercessions: "Prayers asking God for help on behalf of another person."
  prayer_of_the_faithful: "General intercessions prayed during Mass for the Church, the world, and the local community."
  fasting: "Giving something up (literally, to not eat); helps us understand those who do not have it at all."

scripture:
  - reference: "John 4:5–15"
    context: "Jesus and the Samaritan woman at the well. Jesus breaks cultural barriers by making a request of a woman from another culture."
    use: "Engage — Proclaim God's Word"
  - reference: "Matthew 25:40"
    context: "'Whatever you did for one of these least brothers of mine, you did for me.' When you help others, you show you care for Jesus too."
    use: "Reflect — Jesus in the Desert (student page 166)"
  - reference: "Luke 21:1–4"
    context: "The poor widow who gave all she had. Jesus said she put in more than all the rest."
    use: "Explore — Almsgiving section (student page 164)"
  - reference: "Tobit 4:7"
    context: "Give alms from your possessions. Do not turn your face away from any of the poor, so that God's face will not be turned away from you."
    use: "Reading God's Word sidebar (student page 164)"
  - reference: "Matthew 6:1–4"
    context: "Jesus teaches about giving — at home family Scripture reading."
    use: "At Home — Scripture Together (page 168)"

catechist_preparation:
  three_minute_retreat:
    scripture: "Tobit 4:7"
    text: "Give alms from your possessions. Do not turn your face away from any of the poor, so that God's face will not be turned away from you."
    reflection: "In this Scripture passage, Tobit, who knows he will die soon, turns over to his son Tobias some money he has kept aside. He instructs Tobias as to his use of this money, including to give alms to the poor. He tells Tobias that giving alms frees the giver from death and darkness [Tobit 4:10]. The giving of alms is a spiritual discipline Jesus knew was taught in the Old Testament, which he then emphasized in his own teachings. People who have little are precious in God's sight; in helping with their difficulties, we walk in companionship with Jesus."
    question: "How can I guide the children I catechize to find the ways they can give alms from their hearts?"
    prayer: "Jesus, help me see those who have little as precious in your sight so that I may share with an open heart."
  tradition:
    text: "Lent is the period of fasting preceding the celebration of Easter. It recalls Jesus' 40-day fast in the wilderness [Matthew 4:1–11]. Lent begins on Ash Wednesday and ends at the evening Mass of Holy Thursday. During Lent, the Church focuses on our need for God's forgiveness as individuals and as a community. We do so through the Lenten practices of fasting, almsgiving, and prayer."
  catholic_social_teaching:
    themes:
      - "Call to Family, Community, and Participation"
      - "Option for the Poor and Vulnerable"
    reference: "See page 127b for explanations."
  catechism_reference: "CCC 1438 — seasons and days of penance"
  general_directory: "GDC 129 — organization of catechesis around the season of Lent"

prayer_in_session:
  description: "Children ask Jesus for help in thinking of others' needs along with his guidance in providing assistance to meet those needs. Prayer includes time for children to talk with God in the silence of their hearts and share with him their thoughts and concerns."

before_this_session:
  - "Determine whether you will use the Unit Assessment option listed on page 168."
  - "Determine whether you will also discuss the Lent and Holy Week seasonal pages in the back of the Children's Book."
  - "Bookmark your Bible to Matthew 25:40, Luke 21:1–4, and John 4:5–15. Place the Bible open to one of these passages in your Prayer Center."
  - "Read the Guide for this session, choose any additional multimedia content or If Time Allows activities, and gather listed materials."

